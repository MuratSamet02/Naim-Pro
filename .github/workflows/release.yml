name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayımlanacak etiket (örn. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: İmzalı APK ve AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bileşenlerini kur
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Keystore sırrı yoksa derleme debug anahtarıyla devam eder; iş asla
      # sırf imza sırrı eksik diye kırılmaz.
      - name: İmzalama anahtarını hazırla
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/naim-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/naim-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore hazır."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 tanımlı değil - APK debug anahtarıyla imzalanacak."
          fi

      - name: Sürüm bilgisini belirle
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Testleri çalıştır
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Sürüm derlemesi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # ABI split APKs and the AAB are built in separate invocations: AGP
          # cannot produce both in one run (splits are disabled for bundle tasks).
          ./gradlew assembleRelease --console=plain
          ./gradlew reportApkSize --console=plain || true
          ./gradlew bundleRelease --console=plain

      - name: Dosyaları topla
        id: collect
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp {} dist/ \;
          ls -lh dist
          {
            echo "### Naim Pro ${{ steps.version.outputs.tag }}"
            echo
            echo '| Dosya | Boyut |'
            echo '|---|---|'
            find dist -type f -printf '| `%f` | %k KiB |\n' | sort
          } > dist/SIZES.md
          cat dist/SIZES.md

      - name: Sürüm notlarını üret
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>/dev/null || echo "")
          {
            echo "## Naim Pro ${{ steps.version.outputs.version }}"
            echo
            if [ -n "$PREV" ]; then
              echo "Değişiklikler ($PREV → ${{ steps.version.outputs.tag }}):"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV..${{ steps.version.outputs.tag }}"
            else
              echo "İlk sürüm."
              echo
              git log --no-merges --pretty=format:'- %s (%h)' | head -60
            fi
            echo
            echo
            cat dist/SIZES.md
            echo
            echo "**Not:** Bu APK'lar reklam, analitik ve izleme içermez. Lisans: GPL-3.0."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: GitHub Releases'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --title "Naim Pro ${{ steps.version.outputs.version }}" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/*.apk dist/*.aab --clobber

      - name: Artifact olarak da sakla
        uses: actions/upload-artifact@v4
        with:
          name: naim-pro-release
          path: dist/*
          retention-days: 90
          if-no-files-found: error
